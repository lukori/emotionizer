<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emotionizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="column">
      <span class="site-title">Emotionizer</span>
    </div>
  </header>

  <main>
    <div class="column">

      <!-- Input -->
      <section class="input-zone">
        <label class="input-label" for="emotion-input">Enter emotion</label>
        <div class="input-wrap" id="input-wrap">
          <!-- pills injected here by JS -->
          <input
            id="emotion-input"
            class="emotion-input"
            type="text"
            placeholder="joy, trust, curiosity…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Enter one or more emotions"
            aria-autocomplete="list"
            aria-controls="autocomplete-list"
          >
          <ul
            id="autocomplete-list"
            class="autocomplete-list"
            role="listbox"
            aria-label="Emotion suggestions"
          ></ul>
        </div>
        <p class="input-hint">Type an emotion · press <kbd>Enter</kbd> or <kbd>,</kbd> to add · <kbd>Backspace</kbd> to remove last</p>
        <p id="no-result-notice" class="no-result-notice" aria-live="polite"></p>
      </section>

      <!-- Output -->
      <section class="output-zone" aria-label="Generated prompt">
        <div
          id="emotion-display"
          class="emotion-display is-empty"
          aria-live="polite"
        >——</div>
        <div id="descriptor-line" class="descriptor-line">
          <span class="empty-state">Your emotive form prompt will appear here.</span>
        </div>
        <div class="output-meta">
          <span id="attribution" class="attribution"></span>
          <button id="copy-btn" class="copy-btn" aria-label="Copy prompt to clipboard">Copy prompt</button>
        </div>
      </section>

      <!-- Axis readout -->
      <section class="axis-section" id="axis-section">
        <button class="axis-toggle" id="axis-toggle" aria-expanded="false" aria-controls="axis-body">
          Shape fingerprint
          <svg class="axis-chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="2,4 6,8 10,4"/>
          </svg>
        </button>
        <div class="axis-body" id="axis-body">
          <!-- rows injected by JS -->
        </div>
      </section>

    </div>
  </main>

  <script type="module">
    import { init, generate, autocomplete, getAccent } from './app.js';

    // ── State ─────────────────────────────────────────────────────────────────
    const selected = [];   // array of raw token strings
    let acFocusIdx = -1;
    let currentOutput = '';

    // ── Elements ──────────────────────────────────────────────────────────────
    const inputWrap   = document.getElementById('input-wrap');
    const inputEl     = document.getElementById('emotion-input');
    const acList      = document.getElementById('autocomplete-list');
    const displayEl   = document.getElementById('emotion-display');
    const descriptorEl= document.getElementById('descriptor-line');
    const attributionEl = document.getElementById('attribution');
    const copyBtn     = document.getElementById('copy-btn');
    const noResultEl  = document.getElementById('no-result-notice');
    const axisSection = document.getElementById('axis-section');
    const axisToggle  = document.getElementById('axis-toggle');
    const axisBody    = document.getElementById('axis-body');

    // ── Axis definitions ──────────────────────────────────────────────────────
    const AXES = [
      { key: 'surface',     label: 'Surface',     lo: 'smooth',   hi: 'angular' },
      { key: 'lean',        label: 'Lean',         lo: 'backward', hi: 'forward' },
      { key: 'curves',      label: 'Curves',       lo: 'big',      hi: 'small' },
      { key: 'weight',      label: 'Weight',       lo: 'top',      hi: 'bottom' },
      { key: 'proportions', label: 'Proportions',  lo: 'wide',     hi: 'tall' },
      { key: 'complexity',  label: 'Complexity',   lo: 'low',      hi: 'high' },
      { key: 'temperature', label: 'Temperature',  lo: 'cold',     hi: 'warm' },
      { key: 'saturation',  label: 'Saturation',   lo: 'none',     hi: 'vivid' },
      { key: 'brightness',  label: 'Brightness',   lo: 'dark',     hi: 'bright' },
    ];

    function axisPosition(key, value) {
      if (!value) return 0.5;
      const v = value.toLowerCase();
      const map = {
        surface:     { smooth: 0.1, 'slight': 0.35, angular: 0.75, sharp: 0.9, irregular: 0.85 },
        lean:        { 'heavily leaning backward': 0.05, 'slightly leaning backward': 0.3,
                       'straight': 0.5, 'slightly leaning forward': 0.7, 'leaning forward': 0.8, 'heavily leaning forward': 0.95 },
        curves:      { 'big': 0.1, 'medium': 0.5, 'small': 0.8, 'sudden': 0.75, chaotic: 0.9 },
        weight:      { 'top': 0.1, 'middle': 0.5, 'bottom': 0.9, unbalanced: 0.5 },
        proportions: { 'flat and wide': 0.1, round: 0.5, 'tall and round': 0.7, 'tall and slender': 0.85, slender: 0.8 },
        complexity:  { low: 0.1, medium: 0.5, high: 0.9 },
        temperature: { cold: 0.1, neutral: 0.5, warm: 0.9 },
        saturation:  { 'very desaturated': 0.1, desaturated: 0.3, saturated: 0.7, 'highly saturated': 0.85, vibrant: 0.95 },
        brightness:  { 'very dark': 0.05, dark: 0.25, 'medium brightness': 0.5, bright: 0.75, 'very bright': 0.95 },
      };
      const lookup = map[key] || {};
      for (const [k, pos] of Object.entries(lookup)) {
        if (v.includes(k)) return pos;
      }
      return 0.5;
    }

    // ── Render: pills ─────────────────────────────────────────────────────────
    function renderPills() {
      // remove existing pills
      document.querySelectorAll('.pill').forEach(p => p.remove());

      const beforeInput = inputWrap;
      for (let i = 0; i < selected.length; i++) {
        const pill = document.createElement('div');
        pill.className = 'pill';
        pill.dataset.idx = i;
        pill.innerHTML = `${escHtml(selected[i])}<button class="pill-remove" aria-label="Remove ${escHtml(selected[i])}" data-idx="${i}">×</button>`;
        inputWrap.insertBefore(pill, inputEl);
      }
    }

    // ── Add / remove tokens ───────────────────────────────────────────────────
    function addToken(raw) {
      const t = raw.trim().toLowerCase();
      if (!t || selected.includes(t) || selected.length >= 3) return;
      selected.push(t);
      renderPills();
      renderOutput();
    }

    function removeToken(idx) {
      selected.splice(idx, 1);
      renderPills();
      renderOutput();
    }

    // ── Render: output ────────────────────────────────────────────────────────
    function renderOutput() {
      if (!selected.length) {
        displayEl.textContent = '——';
        displayEl.classList.add('is-empty');
        descriptorEl.innerHTML = '<span class="empty-state">Your emotive form prompt will appear here.</span>';
        attributionEl.textContent = '';
        currentOutput = '';
        applyAccent(null);
        renderAxes(null);
        return;
      }

      const { output, attribution, unmatched, result } = generate(selected);

      if (!output) {
        noResultEl.textContent = unmatched.length
          ? `Could not match: ${unmatched.join(', ')}. Try synonyms.`
          : 'No match found.';
        return;
      }

      noResultEl.textContent = unmatched.length
        ? `Note: could not match "${unmatched.join('", "')}"`
        : '';

      // Display emotion name(s)
      const displayName = selected.length === 1
        ? titleCase(result.name || selected[0])
        : selected.map(titleCase).join(' + ');
      displayEl.textContent = displayName;
      displayEl.classList.remove('is-empty');

      // Stagger descriptor words
      currentOutput = output;
      const parts = output.split(', ');
      descriptorEl.innerHTML = '';
      parts.forEach((part, i) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.style.animationDelay = `${i * 18}ms`;
        span.textContent = part;
        descriptorEl.appendChild(span);
        if (i < parts.length - 1) {
          const sep = document.createElement('span');
          sep.className = 'descriptor-separator';
          sep.textContent = ' · ';
          descriptorEl.appendChild(sep);
        }
      });

      attributionEl.textContent = attribution;

      // Canvas accent
      if (result.descriptors) {
        const accent = getAccent(result.descriptors);
        applyAccent(accent);
        renderAxes(result.descriptors);
      }
    }

    function applyAccent(accent) {
      const body = document.body;
      if (!accent) {
        body.style.removeProperty('--accent-bg');
        return;
      }
      // Subtle oklch shift; falls back gracefully in unsupported browsers
      const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const baseL = isDark ? 0.12 : 0.96;
      const L = Math.max(0.05, Math.min(0.98, baseL + accent.lAdjust));
      const C = accent.chroma;
      const H = accent.hue;
      body.style.setProperty('--accent-bg', `oklch(${L} ${C} ${H})`);
      body.style.backgroundColor = `oklch(${L} ${C} ${H})`;
    }

    function renderAxes(descriptors) {
      axisBody.innerHTML = '';
      if (!descriptors) return;
      for (const ax of AXES) {
        const val = descriptors[ax.key] || '';
        const pos = axisPosition(ax.key, val);
        const row = document.createElement('div');
        row.className = 'axis-row';
        row.innerHTML = `
          <span class="axis-label">${ax.label}</span>
          <div class="axis-track" title="${val}">
            <div class="axis-dot" style="left: ${pos * 100}%"></div>
          </div>`;
        axisBody.appendChild(row);
      }
    }

    // ── Autocomplete ──────────────────────────────────────────────────────────
    function updateAutocomplete(prefix) {
      const results = autocomplete(prefix);
      acFocusIdx = -1;
      acList.innerHTML = '';
      if (!results.length || !prefix) {
        acList.classList.remove('open');
        return;
      }
      results.forEach((name, i) => {
        const li = document.createElement('li');
        li.className = 'ac-item';
        li.setAttribute('role', 'option');
        li.textContent = name;
        li.addEventListener('mousedown', e => { e.preventDefault(); selectAC(name); });
        acList.appendChild(li);
      });
      acList.classList.add('open');
    }

    function closeAutocomplete() {
      acList.classList.remove('open');
      acFocusIdx = -1;
    }

    function selectAC(name) {
      addToken(name);
      inputEl.value = '';
      closeAutocomplete();
      inputEl.focus();
    }

    function moveFocus(dir) {
      const items = acList.querySelectorAll('.ac-item');
      if (!items.length) return;
      items.forEach(el => el.classList.remove('focused'));
      acFocusIdx = Math.max(0, Math.min(items.length - 1, acFocusIdx + dir));
      items[acFocusIdx].classList.add('focused');
    }

    // ── Event wiring ──────────────────────────────────────────────────────────
    inputEl.addEventListener('input', () => {
      const v = inputEl.value;
      // check if user typed a separator
      if (v.includes(',')) {
        v.split(',').forEach(p => addToken(p));
        inputEl.value = '';
        closeAutocomplete();
        return;
      }
      updateAutocomplete(v.trim());
    });

    inputEl.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === 'Tab') && acFocusIdx >= 0) {
        e.preventDefault();
        const focused = acList.querySelector('.focused');
        if (focused) { selectAC(focused.textContent); return; }
      }
      if (e.key === 'Enter' && inputEl.value.trim()) {
        e.preventDefault();
        addToken(inputEl.value);
        inputEl.value = '';
        closeAutocomplete();
        return;
      }
      if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); moveFocus(-1); return; }
      if (e.key === 'Escape')    { closeAutocomplete(); return; }
      if (e.key === 'Backspace' && !inputEl.value && selected.length) {
        removeToken(selected.length - 1);
      }
    });

    inputEl.addEventListener('blur', () => setTimeout(closeAutocomplete, 120));

    inputWrap.addEventListener('click', e => {
      const btn = e.target.closest('.pill-remove');
      if (btn) { removeToken(+btn.dataset.idx); return; }
      inputEl.focus();
    });

    // Copy
    copyBtn.addEventListener('click', async () => {
      if (!currentOutput) return;
      try {
        await navigator.clipboard.writeText(currentOutput);
      } catch {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = currentOutput;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      copyBtn.textContent = 'Copied';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copy prompt';
        copyBtn.classList.remove('copied');
      }, 1400);
    });

    // Axis toggle
    axisToggle.addEventListener('click', () => {
      const open = axisSection.classList.toggle('open');
      axisToggle.setAttribute('aria-expanded', open);
    });

    // ── Helpers ───────────────────────────────────────────────────────────────
    function titleCase(s) {
      return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    await init();
    inputEl.focus();
  </script>

</body>
</html>
